    <meta name="theme-color" content="#ffffff" />

    <title>HomeCal サイネージ</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body, #signage-root { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      body { -webkit-text-size-adjust: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
    </style>
    <script>
    (function(){
      function show(msg){
        try{
          var d=document.getElementById('__err__');
          if(!d){
            d=document.createElement('div'); d.id='__err__';
            d.style.cssText='position:fixed;left:0;top:0;right:0;z-index:2147483647;background:#b00020;color:#fff;font:12px/1.5 monospace;padding:8px;white-space:pre-wrap;word-break:break-word;max-height:70%;overflow:auto';
            (document.body||document.documentElement).appendChild(d);
          }
          d.appendChild(document.createTextNode(msg+'\n'));
        }catch(e){}
      }
      window.addEventListener('error',function(e){
        var m=(e&&e.error&&(e.error.stack||e.error.message))||(e&&e.message)||'error';
        show('ERR: '+m+(e&&e.filename?(' @'+e.filename+':'+e.lineno+':'+e.colno):''));
      });
      window.addEventListener('unhandledrejection',function(e){
        var r=e&&e.reason; show('REJ: '+((r&&(r.stack||r.message))||r||'rejection'));
      });
    })();
    </script>

    <link rel="stylesheet" crossorigin href="/HomeCal_web/assets/AuthGate-CfNdepCb.css">
  </head>

    <div id="signage-root"></div>
